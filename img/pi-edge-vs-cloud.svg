<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200" role="img" aria-labelledby="t d">
  <title id="t">Edge vs cloud: latency and 3-year cost</title>
  <desc id="d">Median broker round trip: Raspberry Pi 5 edge 3.9 ms, Azure ARM cloud VM 46.9 ms. Modelled 3-year cost: edge about 9,400 rupees, cloud about 1,03,600 rupees.</desc>
  <style>
    .surface { fill: #fcfcfb }
    .title { font: 600 15px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #0b0b0b }
    .sub { font: 12px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #52514e }
    .lab { font: 13px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #52514e }
    .val { font: 600 13px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #0b0b0b }
    .base { stroke: #c3c2b7; stroke-width: 1 }
    .edge { fill: #2a78d6 } .cloud { fill: #eb6834 }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19 }
      .title, .val { fill: #f0efec } .sub, .lab { fill: #c3c2b7 }
      .base { stroke: #52514e }
      .edge { fill: #3987e5 } .cloud { fill: #d95926 }
    }
  </style>
  <rect class="surface" width="820" height="200" rx="8"/>

  <!-- Panel 1: latency (ms). Scale: 200 px = 50 ms -->
  <g transform="translate(24,0)">
    <text class="title" x="0" y="34">Message round trip</text>
    <text class="sub" x="0" y="54">median, lower is better</text>
    <text class="lab" x="0" y="96">Edge (Pi 5)</text>
    <path class="edge" d="M110 80 h11.6 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-11.6 z"/>
    <text class="val" x="134" y="96">3.9 ms</text>
    <text class="lab" x="0" y="146">Cloud (Azure)</text>
    <path class="cloud" d="M110 130 h183.6 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-183.6 z"/>
    <text class="val" x="306" y="146">46.9 ms</text>
    <line class="base" x1="110" y1="72" x2="110" y2="160"/>
    <text class="sub" x="0" y="186">Edge is 12x faster</text>
  </g>

  <!-- Panel 2: cost (INR). Scale: 200 px = 1,10,000 -->
  <g transform="translate(430,0)">
    <text class="title" x="0" y="34">Cost over 3 years</text>
    <text class="sub" x="0" y="54">modelled, lower is better</text>
    <text class="lab" x="0" y="96">Edge (Pi 5)</text>
    <path class="edge" d="M110 80 h13.1 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-13.1 z"/>
    <text class="val" x="135" y="96">₹9,400</text>
    <text class="lab" x="0" y="146">Cloud (Azure)</text>
    <path class="cloud" d="M110 130 h184.4 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-184.4 z"/>
    <text class="val" x="307" y="146">₹1,03,600</text>
    <line class="base" x1="110" y1="72" x2="110" y2="160"/>
    <text class="sub" x="0" y="186">Edge is about 11x cheaper</text>
  </g>
</svg>
