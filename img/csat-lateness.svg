<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="560">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.sub{fill:#59636e;font-size:11.5px}.t{font-size:13px;font-weight:600}
.box{fill:#ffffff;stroke:#d1d9e0;stroke-width:1.2}
.acc{fill:#ddf4ff;stroke:#0969da}.bad{fill:#ffebe9;stroke:#cf222e}.ok{fill:#dafbe1;stroke:#1a7f37}
.ar{stroke:#59636e;stroke-width:1.4;fill:none;marker-end:url(#h)}.hd{fill:#59636e}
.lab{fill:#59636e;font-size:11px}
@media (prefers-color-scheme:dark){
 text{fill:#e6edf3}.sub,.lab{fill:#9198a1}
 .box{fill:#151b23;stroke:#3d444d}.acc{fill:#0d2a4d;stroke:#4493f8}.bad{fill:#3a1d1f;stroke:#f85149}.ok{fill:#12301c;stroke:#3fb950}
 .ar{stroke:#9198a1}.hd{fill:#9198a1}}
.bar{fill:#8b949e}.hot{fill:#cf222e}.v{font-size:13px;font-weight:600}@media (prefers-color-scheme:dark){.hot{fill:#f85149}}</style>
