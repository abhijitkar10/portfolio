<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="560">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.sub{fill:#59636e;font-size:11.5px}.t{font-size:13px;font-weight:600}
.box{fill:#ffffff;stroke:#d1d9e0;stroke-width:1.2}
.acc{fill:#ddf4ff;stroke:#0969da}.bad{fill:#ffebe9;stroke:#cf222e}.ok{fill:#dafbe1;stroke:#1a7f37}
.ar{stroke:#59636e;stroke-width:1.4;fill:none;marker-end:url(#h)}.hd{fill:#59636e}
.lab{fill:#59636e;font-size:11px}
@media (prefers-color-scheme:dark){
 text{fill:#e6edf3}.sub,.lab{fill:#9198a1}
 .box{fill:#151b23;stroke:#3d444d}.acc{fill:#0d2a4d;stroke:#4493f8}.bad{fill:#3a1d1f;stroke:#f85149}.ok{fill:#12301c;stroke:#3fb950}
 .ar{stroke:#9198a1}.hd{fill:#9198a1}}
.pos{fill:#8b949e}.neg{fill:#cf222e}.zero{stroke:#8b949e;stroke-width:1}.v{font-size:13px;font-weight:600}@media (prefers-color-scheme:dark){.neg{fill:#f85149}}</style>
<text x="0" y="16" class="t">Information ratio, 2018–2026, after each fix</text>
<line x1="270" x2="270" y1="30" y2="180" class="zero"/>
<text x="0" y="56" class="sub">41 hand-picked names</text><text x="0" y="71" class="lab">survivorship bias</text>
<rect x="270" y="44" width="171.6" height="16" rx="3" class="pos"/>
<text x="449.6" y="57" class="v">+0.66</text>
<text x="0" y="104" class="sub">700 point-in-time names</text><text x="0" y="119" class="lab">scored before joining the index</text>
<rect x="270" y="92" width="5.2" height="16" rx="3" class="pos"/>
<text x="283.2" y="105" class="v">+0.02</text>
<text x="0" y="152" class="sub">membership enforced per row</text><text x="0" y="167" class="lab">honest</text>
<rect x="231.0" y="140" width="39.0" height="16" rx="3" class="neg"/>
<text x="278" y="153" class="v">-0.15</text>
</svg>
