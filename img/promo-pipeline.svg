<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 210" width="890">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.sub{fill:#59636e;font-size:11.5px}.t{font-size:13px;font-weight:600}
.box{fill:#ffffff;stroke:#d1d9e0;stroke-width:1.2}
.acc{fill:#ddf4ff;stroke:#0969da}.bad{fill:#ffebe9;stroke:#cf222e}.ok{fill:#dafbe1;stroke:#1a7f37}
.ar{stroke:#59636e;stroke-width:1.4;fill:none;marker-end:url(#h)}.hd{fill:#59636e}
.lab{fill:#59636e;font-size:11px}
@media (prefers-color-scheme:dark){
 text{fill:#e6edf3}.sub,.lab{fill:#9198a1}
 .box{fill:#151b23;stroke:#3d444d}.acc{fill:#0d2a4d;stroke:#4493f8}.bad{fill:#3a1d1f;stroke:#f85149}.ok{fill:#12301c;stroke:#3fb950}
 .ar{stroke:#9198a1}.hd{fill:#9198a1}}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hd"/></marker></defs>
<path class="ar" d="M140 70 L180 70"/>
<path class="ar" d="M320 70 L360 70"/>
<path class="ar" d="M510 70 L550 70"/>
<path class="ar" d="M700 70 L740 70"/>
<path class="ar" d="M810 100 L810 150"/>
<path class="ar" d="M740 175 L700 175"/>
<path class="ar" d="M550 175 L510 175"/>
<rect x="10" y="40" width="130" height="60" rx="8" class="box "/>
<text x="75.0" y="66.0" text-anchor="middle" class="t">3 CSV files</text>
<text x="75.0" y="82.0" text-anchor="middle" class="sub">sales, promos, costs</text>
<rect x="180" y="40" width="140" height="60" rx="8" class="box "/>
<text x="250.0" y="58.0" text-anchor="middle" class="t">Readiness check</text>
<text x="250.0" y="74.0" text-anchor="middle" class="sub">what can this data</text>
<text x="250.0" y="90.0" text-anchor="middle" class="sub">honestly support?</text>
<rect x="360" y="40" width="150" height="60" rx="8" class="box acc"/>
<text x="435.0" y="58.0" text-anchor="middle" class="t">Baseline</text>
<text x="435.0" y="74.0" text-anchor="middle" class="sub">sales without the promo</text>
<text x="435.0" y="90.0" text-anchor="middle" class="sub">trailing → STL → BSTS → DiD</text>
<rect x="550" y="40" width="150" height="60" rx="8" class="box "/>
<text x="625.0" y="58.0" text-anchor="middle" class="t">Incremental profit</text>
<text x="625.0" y="74.0" text-anchor="middle" class="sub">actual − baseline</text>
<text x="625.0" y="90.0" text-anchor="middle" class="sub">− pull-forward, × margin</text>
<rect x="740" y="40" width="140" height="60" rx="8" class="box acc"/>
<text x="810.0" y="58.0" text-anchor="middle" class="t">Placebo gate</text>
<text x="810.0" y="74.0" text-anchor="middle" class="sub">fake lift where there</text>
<text x="810.0" y="90.0" text-anchor="middle" class="sub">was no promo?</text>
<rect x="740" y="150" width="140" height="50" rx="8" class="box ok"/>
<text x="810.0" y="171.0" text-anchor="middle" class="t">One-page PDF</text>
<text x="810.0" y="187.0" text-anchor="middle" class="sub">verdict per promo</text>
<rect x="550" y="150" width="150" height="50" rx="8" class="box "/>
<text x="625.0" y="171.0" text-anchor="middle" class="t">Action plan</text>
<text x="625.0" y="187.0" text-anchor="middle" class="sub">stop / redesign / scale</text>
<rect x="360" y="150" width="150" height="50" rx="8" class="box "/>
<text x="435.0" y="171.0" text-anchor="middle" class="t">What-if</text>
<text x="435.0" y="187.0" text-anchor="middle" class="sub">test a promo first</text>
</svg>
