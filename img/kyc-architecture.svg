<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" width="1100">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.sub{fill:#59636e;font-size:11.5px}.t{font-size:13px;font-weight:600}
.box{fill:#ffffff;stroke:#d1d9e0;stroke-width:1.2}
.acc{fill:#ddf4ff;stroke:#0969da}.bad{fill:#ffebe9;stroke:#cf222e}.ok{fill:#dafbe1;stroke:#1a7f37}
.ar{stroke:#59636e;stroke-width:1.4;fill:none;marker-end:url(#h)}.hd{fill:#59636e}
.lab{fill:#59636e;font-size:11px}
@media (prefers-color-scheme:dark){
 text{fill:#e6edf3}.sub,.lab{fill:#9198a1}
 .box{fill:#151b23;stroke:#3d444d}.acc{fill:#0d2a4d;stroke:#4493f8}.bad{fill:#3a1d1f;stroke:#f85149}.ok{fill:#12301c;stroke:#3fb950}
 .ar{stroke:#9198a1}.hd{fill:#9198a1}}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hd"/></marker></defs>
<path class="ar" d="M120 130 L140 130 L140 70 L160 70"/>
<path class="ar" d="M120 150 L140 150 L140 210 L160 210"/>
<path class="ar" d="M320 70 L340 70 L340 130 L360 130"/>
<path class="ar" d="M320 210 L340 210 L340 150 L360 150"/>
<path class="ar" d="M500 140 L540 140"/>
<path class="ar" d="M690 140 L730 140"/>
<path class="ar" d="M870 140 L910 140"/>
<path class="ar" d="M960 170 L960 210 L925 210 L925 250"/>
<path class="ar" d="M1010 170 L1010 210 L1045 210 L1045 250"/>
<rect x="10" y="110" width="110" height="60" rx="8" class="box "/>
<text x="65.0" y="136.0" text-anchor="middle" class="t">Question</text>
<text x="65.0" y="152.0" text-anchor="middle" class="sub">plain English</text>
<rect x="160" y="40" width="160" height="60" rx="8" class="box "/>
<text x="240.0" y="66.0" text-anchor="middle" class="t">Dense search</text>
<text x="240.0" y="82.0" text-anchor="middle" class="sub">BGE-small embeddings</text>
<rect x="160" y="180" width="160" height="60" rx="8" class="box "/>
<text x="240.0" y="206.0" text-anchor="middle" class="t">BM25</text>
<text x="240.0" y="222.0" text-anchor="middle" class="sub">written from scratch</text>
<rect x="360" y="110" width="140" height="60" rx="8" class="box "/>
<text x="430.0" y="136.0" text-anchor="middle" class="t">Fusion</text>
<text x="430.0" y="152.0" text-anchor="middle" class="sub">reciprocal rank (RRF)</text>
<rect x="540" y="110" width="150" height="60" rx="8" class="box acc"/>
<text x="615.0" y="128.0" text-anchor="middle" class="t">Re-rank</text>
<text x="615.0" y="144.0" text-anchor="middle" class="sub">BGE cross-encoder</text>
<text x="615.0" y="160.0" text-anchor="middle" class="sub">top 20 → top 5</text>
<rect x="730" y="110" width="140" height="60" rx="8" class="box "/>
<text x="800.0" y="136.0" text-anchor="middle" class="t">LLM answer</text>
<text x="800.0" y="152.0" text-anchor="middle" class="sub">only from the 5 chunks</text>
<rect x="910" y="110" width="150" height="60" rx="8" class="box acc"/>
<text x="985.0" y="136.0" text-anchor="middle" class="t">Citation check</text>
<text x="985.0" y="152.0" text-anchor="middle" class="sub">cited page retrieved?</text>
<rect x="870" y="250" width="110" height="50" rx="8" class="box ok"/>
<text x="925.0" y="271.0" text-anchor="middle" class="t">Answer</text>
<text x="925.0" y="287.0" text-anchor="middle" class="sub">with [p.N]</text>
<rect x="995" y="250" width="100" height="50" rx="8" class="box bad"/>
<text x="1045.0" y="271.0" text-anchor="middle" class="t">Refuse</text>
<text x="1045.0" y="287.0" text-anchor="middle" class="sub">&quot;Not found&quot;</text>
<text x="240" y="30" text-anchor="middle" class="lab">meaning</text>
<text x="240" y="260" text-anchor="middle" class="lab">exact words</text>
<text x="615" y="95" text-anchor="middle" class="lab">recall@5 0.93</text>
</svg>
