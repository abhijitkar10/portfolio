<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 230" width="870">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.sub{fill:#59636e;font-size:11.5px}.t{font-size:13px;font-weight:600}
.box{fill:#ffffff;stroke:#d1d9e0;stroke-width:1.2}
.acc{fill:#ddf4ff;stroke:#0969da}.bad{fill:#ffebe9;stroke:#cf222e}.ok{fill:#dafbe1;stroke:#1a7f37}
.ar{stroke:#59636e;stroke-width:1.4;fill:none;marker-end:url(#h)}.hd{fill:#59636e}
.lab{fill:#59636e;font-size:11px}
@media (prefers-color-scheme:dark){
 text{fill:#e6edf3}.sub,.lab{fill:#9198a1}
 .box{fill:#151b23;stroke:#3d444d}.acc{fill:#0d2a4d;stroke:#4493f8}.bad{fill:#3a1d1f;stroke:#f85149}.ok{fill:#12301c;stroke:#3fb950}
 .ar{stroke:#9198a1}.hd{fill:#9198a1}}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hd"/></marker></defs>
<path class="ar" d="M150 60 L190 60"/>
<path class="ar" d="M340 60 L380 60"/>
<path class="ar" d="M510 60 L550 60"/>
<path class="ar" d="M680 60 L720 60"/>
<path class="ar" d="M790 90 L790 140"/>
<path class="ar" d="M720 170 L660 170"/>
<path class="ar" d="M480 170 L420 170"/>
<rect x="10" y="30" width="140" height="60" rx="8" class="box "/>
<text x="80.0" y="56.0" text-anchor="middle" class="t">Kaggle: 9 CSVs</text>
<text x="80.0" y="72.0" text-anchor="middle" class="sub">Olist e-commerce</text>
<rect x="190" y="30" width="150" height="60" rx="8" class="box acc"/>
<text x="265.0" y="48.0" text-anchor="middle" class="t">Join + aggregate</text>
<text x="265.0" y="64.0" text-anchor="middle" class="sub">one row per order</text>
<text x="265.0" y="80.0" text-anchor="middle" class="sub">97,916 orders</text>
<rect x="380" y="30" width="130" height="60" rx="8" class="box "/>
<text x="445.0" y="48.0" text-anchor="middle" class="t">Clean</text>
<text x="445.0" y="64.0" text-anchor="middle" class="sub">17 features</text>
<text x="445.0" y="80.0" text-anchor="middle" class="sub">80/20 split</text>
<rect x="550" y="30" width="130" height="60" rx="8" class="box "/>
<text x="615.0" y="48.0" text-anchor="middle" class="t">Train</text>
<text x="615.0" y="64.0" text-anchor="middle" class="sub">random forest</text>
<text x="615.0" y="80.0" text-anchor="middle" class="sub">or linear</text>
<rect x="720" y="30" width="140" height="60" rx="8" class="box "/>
<text x="790.0" y="56.0" text-anchor="middle" class="t">Evaluate</text>
<text x="790.0" y="72.0" text-anchor="middle" class="sub">RMSE, R²</text>
<rect x="720" y="140" width="140" height="60" rx="8" class="box acc"/>
<text x="790.0" y="158.0" text-anchor="middle" class="t">Quality gate</text>
<text x="790.0" y="174.0" text-anchor="middle" class="sub">register only if</text>
<text x="790.0" y="190.0" text-anchor="middle" class="sub">R² clears bar</text>
<rect x="480" y="140" width="180" height="60" rx="8" class="box "/>
<text x="570.0" y="166.0" text-anchor="middle" class="t">MLflow</text>
<text x="570.0" y="182.0" text-anchor="middle" class="sub">runs, metrics, registry</text>
<rect x="240" y="140" width="180" height="60" rx="8" class="box ok"/>
<text x="330.0" y="166.0" text-anchor="middle" class="t">Streamlit app</text>
<text x="330.0" y="182.0" text-anchor="middle" class="sub">scores a delivered order</text>
<text x="360" y="125" text-anchor="middle" class="lab">ZenML runs the top row</text>
<text x="570" y="220" text-anchor="middle" class="lab">models:/…/latest</text>
</svg>
